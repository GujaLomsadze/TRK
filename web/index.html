<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRK.EXE</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="hdr panel">
  <div class="brand">
    <h1 class="title">TRK.EXE</h1>
    <div class="sub">fleet monitor · <span id="host"></span> <span id="conn" class="conn">○ connecting</span></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="limits" id="limits"></div>
  <nav class="nav" aria-label="views">
    <a class="btn btn-secondary active" href="#">Fleet</a>
    <span class="btn btn-secondary disabled" title="coming later">Timeline</span>
    <span class="btn btn-secondary disabled" title="coming later">Orbit</span>
    <button class="btn btn-secondary icon-btn" id="layout-open" type="button" aria-haspopup="dialog" aria-label="Card layout" title="Card layout">⚙</button>
  </nav>
</header>
<main class="layout">
  <section class="grid" id="grid" aria-label="agents"></section>
  <aside class="side">
    <section class="panel box needs-box"><h2>Needs you</h2><ul class="list" id="needs"></ul></section>
    <section class="panel box coll-box"><h2>Collisions</h2><ul class="list" id="collisions"></ul></section>
  </aside>
</main>
<section class="panel timeline" aria-label="last 30 minutes">
  <div class="tl-head"><h2>Last 30 minutes</h2>
    <div class="tl-legend"><span class="tl-key tl-read"></span>read <span class="tl-key tl-edit"></span>edit <span class="tl-key tl-run"></span>run <span class="tl-key tl-wait"></span>waiting on you</div></div>
  <div class="tl-body" id="timeline"></div>
</section>
<div class="scanlines" aria-hidden="true"></div>
<dialog class="panel drawer" id="layout" aria-labelledby="layout-title">
  <div class="drawer-head"><h2 class="drawer-title" id="layout-title">⚙ Card layout</h2>
    <button class="btn btn-secondary" id="layout-close" type="button" aria-label="Close">✕</button></div>
  <div class="drawer-body" id="layout-body"></div>
  <div class="drawer-foot"><span class="meta">Changes apply live and are saved in this browser.</span>
    <button class="btn btn-secondary" id="layout-reset" type="button">Reset to default</button></div>
</dialog>
<script src="app.js"></script>
<script src="editor.js"></script>
</body>
</html>
